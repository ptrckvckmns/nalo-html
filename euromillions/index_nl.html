<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EuroMillions &ndash; volgende trekking</title>
  <meta name="description" content="Datum en jackpot van de volgende EuroMillions-trekking.">

  <!-- Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Logo, 8px van rechts en 8px van boven -->
  <img class="em-logo" src="images/logoEumColor.svg" alt="EuroMillions" width="120" height="74">

  <main class="em" id="em-card" data-state="loading" aria-live="polite">

    <!-- Regel 1: "vrijdag 20 november" (uit drawdate) -->
    <p class="em__date" id="em-date">&nbsp;</p>

    <!-- Regel 2: "Jackpot van" + estimatedjackpotprefix -->
    <p class="em__label" id="em-label">&nbsp;</p>

    <!-- Regel 3: jackpot in sprite-font, bv. € 37.000.000 -->
    <p class="em__jackpot" id="em-jackpot"></p>

    <!-- Foutmelding / draw break -->
    <p class="em__status" id="em-status" role="status" hidden></p>
    <button class="em__retry" id="em-retry" type="button" hidden>Opnieuw proberen</button>

  </main>

  <noscript>
    <p class="em-noscript">Schakel JavaScript in om de jackpot van de volgende EuroMillions-trekking te zien.</p>
  </noscript>

  <script src="js/main.js"></script>
</body>
</html>
