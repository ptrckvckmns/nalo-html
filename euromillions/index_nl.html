<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EuroMillions &ndash; volgende trekking</title>
  <meta name="description" content="Datum en jackpot van de volgende EuroMillions-trekking.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="em-card" id="em-card" data-state="loading" aria-live="polite">

    <!-- decoratieve sterren (geen afbeelding nodig) -->
    <div class="em-card__stars" aria-hidden="true"></div>

    <p class="em-card__game">EuroMillions</p>

    <!-- Datum: "donderdag 9 november" -->
    <p class="em-card__date" id="em-date">&nbsp;</p>

    <div class="em-card__jackpot">
      <!-- "Jackpot van " + estimatedjackpotprefix -->
      <p class="em-card__label" id="em-label">&nbsp;</p>
      <!-- "€ 37.000.000" -->
      <p class="em-card__amount" id="em-amount">&nbsp;</p>
    </div>

    <!-- Juridische vermelding uit de API -->
    <p class="em-card__legal" id="em-legal" hidden></p>

    <!-- Foutmelding / draw break -->
    <p class="em-card__status" id="em-status" role="status" hidden></p>

    <button class="em-card__retry" id="em-retry" type="button" hidden>Opnieuw proberen</button>

  </main>

  <noscript>
    <p class="em-noscript">Schakel JavaScript in om de jackpot van de volgende EuroMillions-trekking te zien.</p>
  </noscript>

  <script src="js/main.js"></script>
</body>
</html>
